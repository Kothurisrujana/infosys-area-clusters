<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
/* Layout: full-height map with a distance-sorted area register beside it */
:root{--bg:#f6f7f5;--panel:#fff;--fg:#1d2a2c;--muted:#5d6b6d;--line:#dde2df;--ring:#0b6e75;--own:#c2410c;--dot:#0b6e75;--font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{font:14px/1.4 var(--font);color:var(--fg);background:var(--bg);display:grid;grid-template-columns:320px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
header{padding:16px;border-bottom:1px solid var(--line)}
h1{font-size:18px;font-weight:600;margin:0 0 4px;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:50%;background:var(--dot);display:inline-block}.sw.own{background:var(--own)}.sw.ring{background:none;border:2px dashed var(--ring)}.sw.hq{background:var(--fg);border-radius:2px;transform:rotate(45deg)}
#q{margin:12px 16px;padding:8px 10px;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
#list{list-style:none;margin:0;padding:0 0 12px;overflow:auto;flex:1;min-height:0}
#list button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr 34px 46px;gap:6px;width:100%;padding:6px 16px;cursor:pointer}
#list button:hover,#list button:focus-visible{background:var(--bg)}
#list button:focus-visible{box-shadow:inset 0 0 0 2px var(--ring)}
#list .own{color:var(--own);font-weight:600}
#list .d,#list .k{color:var(--muted);font-size:12px;text-align:right;font-variant-numeric:tabular-nums;align-self:center}
#map{min-width:0;min-height:0;background:#e8ecea}
.lbl{position:absolute;white-space:nowrap;font:500 11.5px/1.1 var(--font);color:#16282a;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff,0 0 1px #fff;pointer-events:none}
.lbl.own{color:#9a3208;font-weight:600;font-size:12.5px}
.lbl.hq{font-weight:600;font-size:13px;color:#000}
.hq-mark{width:14px;height:14px;background:#111;border:2px solid #fff;transform:rotate(45deg);box-shadow:0 0 0 1px #111}
@media (max-width:760px){body{grid-template-columns:1fr;grid-template-rows:62vh auto;height:auto;min-height:100vh}#map{grid-row:1;height:62vh}aside{grid-row:2;border-right:0}#list{overflow:visible}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#172022;--panel:#1e292b;--fg:#e6ecea;--muted:#9fadab;--line:#33413f;--ring:#57c7cf;--own:#fb923c;--dot:#57c7cf;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#172022;--panel:#1e292b;--fg:#e6ecea;--muted:#9fadab;--line:#33413f;--ring:#57c7cf;--own:#fb923c;--dot:#57c7cf;color-scheme:dark}
</style></head><body>
<aside><header><h1>Areas within 9 km of Infosys, Gachibowli</h1>

const map=L.map('map',{zoomSnap:.25,zoomDelta:.5}).setView(HQ,12);
L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',{subdomains:'abc',maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, tiles by <a href="https://www.openstreetmap.fr/">OpenStreetMap France</a>'}).addTo(map);
L.control.scale({imperial:false}).addTo(map);
const ringColor='#0b6e75';
const circle=L.circle(HQ,{radius:RADIUS,color:ringColor,weight:2.5,dashArray:'8 6',fillColor:ringColor,fillOpacity:.07,interactive:false}).addTo(map);
map.fitBounds(circle.getBounds(),{padding:[16,16]});
L.marker(HQ,{icon:L.divIcon({className:'',html:'<div class="hq-mark"></div>',iconSize:[14,14]}),title:'Infosys, Gachibowli',zIndexOffset:1000}).addTo(map).bindPopup('<b>Infosys, Gachibowli</b><br>17.4351, 78.3506');
const labelPane=map.createPane('labels');labelPane.style.zIndex=640;labelPane.style.pointerEvents='none';
const ctx=document.createElement('canvas').getContext('2d');
const items=AREAS.map(a=>{
  const m=L.circleMarker([a.lat,a.lon],{radius:a.own?6:4,color:'#fff',weight:1.5,fillColor:a.own?'#c2410c':'#0b6e75',fillOpacity:1}).addTo(map).bindPopup(`<b>${a.name}</b><br>${a.km} km ${a.dir} of Infosys`);
  const el=document.createElement('div');el.className='lbl'+(a.own?' own':'');el.textContent=a.name;labelPane.appendChild(el);
  ctx.font=(a.own?'600 12.5px':'500 11.5px')+' "IBM Plex Sans",sans-serif';
  return{a,m,el,w:ctx.measureText(a.name).width+4,h:a.own?15:14};
});
const hqLabel=document.createElement('div');hqLabel.className='lbl hq';hqLabel.textContent='Infosys';labelPane.appendChild(hqLabel);
/* Place labels greedily: property-file areas first, then nearest. A label that cannot fit is hidden until the map is zoomed in. */
function layout(){
  const hp=map.latLngToLayerPoint(HQ),taken=[{x:hp.x+10,y:hp.y-8,w:50,h:16}];
  L.DomUtil.setPosition(hqLabel,L.point(hp.x+10,hp.y-8));
  const pts=items.map(i=>map.latLngToLayerPoint(i.m.getLatLng()));
  pts.forEach(p=>taken.push({x:p.x-5,y:p.y-5,w:10,h:10}));
  const order=items.map((it,idx)=>({it,p:pts[idx]})).sort((x,y)=>(y.it.a.own-x.it.a.own)||(x.it.a.km-y.it.a.km));
  const hit=r=>taken.some(t=>r.x<t.x+t.w&&t.x<r.x+r.w&&r.y<t.y+t.h&&t.y<r.y+r.h);
  order.forEach(({it,p})=>{
    const c=[[7,-it.h/2],[-it.w-7,-it.h/2],[-it.w/2,-it.h-6],[-it.w/2,6],[7,-it.h-3],[-it.w-7,-it.h-3],[7,3],[-it.w-7,3]];
    let spot=null;for(const[dx,dy]of c){const r={x:p.x+dx,y:p.y+dy,w:it.w,h:it.h};if(!hit(r)){spot=r;break}}
    it.el.hidden=!spot;
    if(spot){taken.push(spot);L.DomUtil.setPosition(it.el,L.point(spot.x,spot.y))}
  });
}
map.on('zoomend moveend',layout);
layout();
if(document.fonts)document.fonts.ready.then(layout);
const list=document.getElementById('list');document.getElementById('n').textContent=AREAS.length;
items.forEach(i=>{const li=document.createElement('li'),b=document.createElement('button');b.type='button';
  b.innerHTML=`<span class="${i.a.own?'own':''}">${i.a.name}</span><span class="d">${i.a.dir}</span><span class="k">${i.a.km} km</span>`;
  b.onclick=()=>{map.flyTo(i.m.getLatLng(),Math.max(map.getZoom(),14),{duration:.6});i.m.openPopup()};li.appendChild(b);list.appendChild(li);i.li=li});
document.getElementById('q').addEventListener('input',e=>{const v=e.target.value.trim().toLowerCase();items.forEach(i=>i.li.hidden=!i.a.name.toLowerCase().includes(v))});
window.__map={map,items};
</script></body></html>
